name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dsp-tests:
    name: DSP validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The DSP core has no Android or Oboe dependency precisely so that it can
      # be compiled and exercised on a plain host before anything is packaged.
      - name: Build the offline DSP test harness
        run: |
          clang++ -std=c++17 -O2 -Wall -Wextra \
            -Iapp/src/main/cpp/dsp \
            tools/dsptest/main.cpp app/src/main/cpp/dsp/*.cpp \
            -o dsptest

      - name: Run pitch, latency and polyphony checks
        run: ./dsptest

  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew assembleRelease --stacktrace

      - name: Build the release payload
        run: |
          mkdir -p out
          # A fixed filename, so the app can point at a permalink that never
          # changes. The version lives in version.json instead.
          cp app/build/outputs/apk/release/app-release.apk out/harmonizer.apk

          python3 - <<'PY'
          import hashlib, json, os, subprocess

          apk = "out/harmonizer.apk"
          run = int(os.environ["GITHUB_RUN_NUMBER"])
          notes = subprocess.run(
              ["git", "log", "-1", "--pretty=%s"],
              capture_output=True, text=True, check=True).stdout.strip()

          # json.dump handles quoting, so a commit subject with quotes or
          # backslashes in it cannot produce a manifest the app fails to parse.
          manifest = {
              "versionCode": 100 + run,
              "versionName": f"1.0.{run}",
              "commit": os.environ["GITHUB_SHA"][:7],
              "sizeBytes": os.path.getsize(apk),
              "sha256": hashlib.sha256(open(apk, "rb").read()).hexdigest(),
              "notes": notes,
          }
          with open("out/version.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmonizer-apk
          path: out/*
          if-no-files-found: error

      # A release asset is a plain download link, which is what lets the in-app
      # updater fetch it with no credentials, and what lets you install straight
      # from the phone's browser.
      - name: Publish to the "latest" release
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/harmonizer.apk out/version.json \
            --title "v1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Build ${GITHUB_RUN_NUMBER} of ${GITHUB_SHA::7}.

          Already have the app installed? Open Settings inside it and tap
          **Check for updates** -- no need to download anything by hand.

          Installing for the first time: download \`harmonizer.apk\` below and open it."
