name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dsp-tests:
    name: DSP validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The DSP core has no Android or Oboe dependency precisely so that it can
      # be compiled and exercised on a plain host before anything is packaged.
      - name: Build the offline DSP test harness
        run: |
          clang++ -std=c++17 -O2 -Wall -Wextra \
            -Iapp/src/main/cpp/dsp \
            tools/dsptest/main.cpp app/src/main/cpp/dsp/*.cpp \
            -o dsptest

      - name: Run pitch, latency and polyphony checks
        run: ./dsptest

  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the artifact after the commit
        id: rename
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/harmonizer-${GITHUB_SHA::7}.apk"
          echo "apk=out/harmonizer-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmonizer-apk
          path: out/*.apk
          if-no-files-found: error

      # A release asset is a plain download link, which is what makes it
      # possible to install straight from the phone's browser with no computer
      # in the loop. Workflow artifacts are zipped and need a login.
      - name: Publish to the "latest" release
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.rename.outputs.apk }}" \
            --title "Latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7}.

          Download the .apk below on the phone and open it to install.
          Android will ask you to allow installing from your browser the first time."
