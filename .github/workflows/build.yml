name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  dsp-tests:
    name: DSP validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the offline DSP test harness
        run: |
          clang++ -std=c++17 -O2 -Wall -Wextra \
            -Iapp/src/main/cpp/dsp \
            tools/dsptest/main.cpp app/src/main/cpp/dsp/*.cpp -o dsptest
      - name: Run pitch, latency and polyphony checks
        run: ./dsptest

  # ---------------------------------------------------------------------------
  # The plugin's jazz chord mode is plain C++ with no JUCE in it, so its checks
  # compile in one step rather than waiting on a full plugin build.
  jazz-tests:
    name: Jazz chord dictionary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the jazz voicer checks
        run: |
          clang++ -std=c++17 -O2 -Wall -Wextra \
            -Iplugin/Source \
            plugin/Tests/JazzHarness.cpp plugin/Source/JazzVoicer.cpp \
            plugin/Source/JazzChordLibrary.cpp plugin/Source/JazzMidiImport.cpp -o jazztest
      - name: Run key centre, dictionary, range and voice-leading checks
        run: ./jazztest

  # ---------------------------------------------------------------------------
  # Builds the plugin on Linux purely to exercise the wrapper: parameter
  # mapping, host MIDI, channel summing, reported latency. The shipped macOS and
  # Windows builds cannot run headless tests in CI, so this is where wrapper
  # regressions get caught.
  plugin-tests:
    name: Plugin wrapper checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audio and GUI development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libcurl4-openssl-dev ninja-build
      - name: Configure
        run: |
          cmake -B build -S plugin -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DHARMONIZER_VERSION_CODE=${{ github.run_number }} \
            -DHARMONIZER_VERSION_NAME=ci
      - name: Build and run
        run: |
          cmake --build build --target HarmonizerPluginTest --parallel 3
          find build -name HarmonizerPluginTest -type f -perm -u+x -exec {} \;

  # ---------------------------------------------------------------------------
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licences
        # The runner image already has the SDK. Fetching command-line tools from
        # Google is an extra network dependency that has failed here before, so
        # use what is installed and let Gradle pull anything else it needs.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Assemble
        run: ./gradlew assembleRelease --stacktrace
      - name: Stage
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/harmonizer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  plugin-macos:
    name: Plugin (macOS, AU + VST3)
    runs-on: macos-14
    needs: plugin-tests
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -B build -S plugin -DCMAKE_BUILD_TYPE=Release \
            -DHARMONIZER_BUILD_TESTS=OFF \
            -DHARMONIZER_VERSION_CODE=${{ github.run_number }} \
            -DHARMONIZER_VERSION_NAME=1.0.${{ github.run_number }}
      - name: Build AU, VST3 and the Setup app
        run: |
          cmake --build build --target HarmonizerPlugin_AU HarmonizerPlugin_VST3 \
            HarmonizerSetup --parallel 3

      - name: Sign and package
        run: |
          set -e
          ART=build/HarmonizerPlugin_artefacts/Release
          mkdir -p stage
          cp -R "$ART/VST3/Harmonizer.vst3" stage/
          cp -R "$ART/AU/Harmonizer.component" stage/

          # Ad-hoc signature. Without any signature at all, Apple Silicon refuses
          # to load the binary; this is not notarisation and does not clear
          # Gatekeeper's quarantine flag on a browser download, which is what the
          # bundled install script handles.
          codesign --force --deep --sign - stage/Harmonizer.vst3
          codesign --force --deep --sign - stage/Harmonizer.component
          codesign --verify --verbose stage/Harmonizer.vst3
          codesign --verify --verbose stage/Harmonizer.component

          cp plugin/packaging/install-macos.command stage/
          chmod +x stage/install-macos.command

          # ditto rather than zip: it preserves the executable bit, and a plugin
          # binary without it will not load.
          mkdir -p out
          ditto -c -k --sequesterRsrc stage out/Harmonizer-macOS.zip

          # The guided installer, shipped on its own: this is what the download
          # page hands people, and the only thing most users ever run.
          SETUP="build/HarmonizerSetup_artefacts/Release/Harmonizer Setup.app"
          codesign --force --deep --sign - "$SETUP"
          codesign --verify --verbose "$SETUP"
          mkdir -p setupstage
          cp -R "$SETUP" setupstage/
          ditto -c -k --sequesterRsrc setupstage out/HarmonizerSetup-macOS.zip
          ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-macos
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  plugin-windows:
    name: Plugin (Windows, VST3)
    runs-on: windows-latest
    needs: plugin-tests
    steps:
      - uses: actions/checkout@v4
      - name: Allow long paths
        # JUCE's tree is deep and the runner's workspace path is already long;
        # without this, configure can trip the 260-character limit.
        run: git config --system core.longpaths true

      # bash rather than pwsh for anything that runs a native compiler.
      # PowerShell turns a native program's stderr into error records when the
      # stream is redirected, and with the default ErrorActionPreference that
      # aborts the step even when the program itself succeeded.
      #
      # Failures are echoed back as ::error:: annotations because this is the
      # only build output readable from outside the Actions UI -- logs, job
      # summaries and artifacts are all unavailable here.
      - name: Configure
        shell: bash
        run: |
          set +e
          # No -G: pin a Visual Studio version and the build breaks the moment
          # GitHub rolls the runner image to a newer one, which is exactly what
          # happened here. CMake picks whichever Visual Studio is actually
          # installed, and VS generators default to the host architecture.
          cmake -B build -S plugin \
            -DHARMONIZER_BUILD_TESTS=OFF \
            -DHARMONIZER_VERSION_CODE=${{ github.run_number }} \
            -DHARMONIZER_VERSION_NAME=1.0.${{ github.run_number }} 2>&1 | tee configure.log
          status=${PIPESTATUS[0]}
          generator=$(grep -m1 "^CMAKE_GENERATOR:INTERNAL=" build/CMakeCache.txt 2>/dev/null | cut -d= -f2-)
          echo "::notice::CMake used generator: ${generator:-unknown} (cmake $(cmake --version | head -1))"
          if [ "$status" -ne 0 ]; then
            echo "::error::CMake configure failed on Windows (exit $status)"
            tail -n 40 configure.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit 1
          fi

      - name: Build VST3 and the Setup app
        shell: bash
        run: |
          set +e
          cmake --build build --config Release \
            --target HarmonizerPlugin_VST3 HarmonizerSetup --parallel 3 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Windows build failed (exit $status)"
            grep -iE "error" build.log | tail -n 30 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit 1
          fi

      - name: Package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter Harmonizer.vst3 `
            build\HarmonizerPlugin_artefacts\Release\VST3 | Where-Object { -not $_.PSIsContainer }
          if ($dll) {
            # Nothing pins the architecture any more, so check rather than assume.
            $bytes = [System.IO.File]::ReadAllBytes($dll.FullName)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            Write-Host ("PE machine type: 0x{0:X4}" -f $machine)
            if ($machine -ne 0x8664) {
              Write-Host "::error::Built plugin is not x64 (machine 0x$($machine.ToString('X4')))"
              exit 1
            }
          }
          $art = "build\HarmonizerPlugin_artefacts\Release\VST3\Harmonizer.vst3"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Recurse -Force $art stage\
          Copy-Item plugin\packaging\install-windows.bat stage\
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # stage\* so the archive root holds Harmonizer.vst3 rather than its contents.
          Compress-Archive -Path stage\* -DestinationPath out\Harmonizer-Windows.zip -Force

          # A bare .exe rather than a zip: one file, double-click, done.
          Copy-Item "build\HarmonizerSetup_artefacts\Release\Harmonizer Setup.exe" `
            out\HarmonizerSetup.exe
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # One job publishes everything, so the app and both plugin builds always land
  # on the same release together and no two jobs race to recreate the tag.
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [android, plugin-macos, plugin-windows]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect and describe
        run: |
          mkdir -p out
          cp artifacts/android/harmonizer.apk out/
          cp artifacts/plugin-macos/Harmonizer-macOS.zip out/
          cp artifacts/plugin-macos/HarmonizerSetup-macOS.zip out/
          cp artifacts/plugin-windows/Harmonizer-Windows.zip out/
          cp artifacts/plugin-windows/HarmonizerSetup.exe out/

          python3 - <<'PY'
          import hashlib, json, os, subprocess

          run = int(os.environ["GITHUB_RUN_NUMBER"])
          notes = subprocess.run(["git", "log", "-1", "--pretty=%s"],
                                 capture_output=True, text=True, check=True).stdout.strip()
          commit = os.environ["GITHUB_SHA"][:7]

          def describe(path):
              return {
                  "file": os.path.basename(path),
                  "sizeBytes": os.path.getsize(path),
                  "sha256": hashlib.sha256(open(path, "rb").read()).hexdigest(),
              }

          # The Android app polls this one.
          apk = describe("out/harmonizer.apk")
          with open("out/version.json", "w") as f:
              json.dump({"versionCode": 100 + run, "versionName": f"1.0.{run}",
                         "commit": commit, "notes": notes, **apk}, f, indent=2)

          # The plugin polls this one; it needs a download per platform.
          with open("out/plugin-version.json", "w") as f:
              json.dump({"versionCode": run, "versionName": f"1.0.{run}",
                         "commit": commit, "notes": notes,
                         "assets": {"macos": describe("out/Harmonizer-macOS.zip"),
                                    "windows": describe("out/Harmonizer-Windows.zip")}},
                        f, indent=2)

          print(open("out/version.json").read())
          print(open("out/plugin-version.json").read())
          PY

      - name: Fetch the version history published so far
        # "latest" is the only release this workflow ever deletes, so the
        # cumulative history has to be read back from it before that happens,
        # or each run would silently forget every build before it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh release download latest --repo "$GITHUB_REPOSITORY" \
            --pattern versions.json --dir prev --clobber || true

      - name: Build the version history
        # Every build gets its own permanent release below, and this is the
        # index of them the plugin's "Version history" panel reads -- append
        # this run rather than replace, so it is the one place none of that
        # rolling-release behaviour applies to.
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          run = int(os.environ["GITHUB_RUN_NUMBER"])
          notes = json.load(open("out/plugin-version.json"))["notes"]

          path = "prev/versions.json"
          history = json.load(open(path)) if os.path.exists(path) else []
          if not isinstance(history, list):
              history = []

          by_code = {int(e["versionCode"]): e for e in history if "versionCode" in e}
          by_code[run] = {
              "versionCode": run,
              "versionName": f"1.0.{run}",
              "tag": f"v1.0.{run}",
              "notes": notes,
              "publishedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }

          ordered = sorted(by_code.values(), key=lambda e: e["versionCode"], reverse=True)
          with open("out/versions.json", "w") as f:
              json.dump(ordered, f, indent=2)
          print(open("out/versions.json").read())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-payload
          path: out/*

      - name: Publish this build's own permanent release
        # Never deleted or recreated by a later run, unlike "latest" below --
        # this is what makes rolling back to an older build possible at all.
        # Same assets as "latest", so the plugin's rollback path can use the
        # exact download/verify pipeline an ordinary update does.
        #
        # A re-run of this exact workflow run reuses GITHUB_RUN_NUMBER, so the
        # tag can already exist -- delete just that one and recreate it rather
        # than fail, which is the same tolerance "latest" already has below.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" \
            out/harmonizer.apk out/version.json \
            out/HarmonizerSetup-macOS.zip out/HarmonizerSetup.exe \
            out/Harmonizer-macOS.zip out/Harmonizer-Windows.zip out/plugin-version.json \
            out/versions.json \
            --title "$TAG" \
            --notes "Build ${GITHUB_RUN_NUMBER} of ${GITHUB_SHA::7}. Kept permanently so the
          plugin's Version history panel can roll back to it."

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            out/harmonizer.apk out/version.json \
            out/HarmonizerSetup-macOS.zip out/HarmonizerSetup.exe \
            out/Harmonizer-macOS.zip out/Harmonizer-Windows.zip out/plugin-version.json \
            out/versions.json \
            --title "v1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Build ${GITHUB_RUN_NUMBER} of ${GITHUB_SHA::7}.

          **Already installed?** Tap **Check for updates** in the Android app's
          Settings, or press **Check for updates** in the plugin. No manual
          download needed.

          **Setting up for the first time?** Use the guided page:
          https://dylancleverdon.github.io/harmonizer-app/

          **Plugin** — \`HarmonizerSetup-macOS.zip\` or \`HarmonizerSetup.exe\`
          installs everything and handles future updates. Its **Version history**
          panel can install any past build again if an update causes a problem.
          **Android** — \`harmonizer.apk\`.

          The plain \`Harmonizer-macOS.zip\` / \`Harmonizer-Windows.zip\` archives
          hold just the plugin bundles, for installing by hand."

  # ---------------------------------------------------------------------------
  pages:
    name: Download page
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
